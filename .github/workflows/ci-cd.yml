name: CI/CD demo
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Python version
        run: |
          python --version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest test_app.py -v

  build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ci-cd-demo:latest .

  deploy:
    name: Deploy to localhost
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Stop and remove old container
        run: |
          docker rm -f python-app 2>$null
          $LASTEXITCODE = 0

      - name: Start new container
        run: |
          docker run -d --name python-app -p 5001:5001 --restart unless-stopped ci-cd-demo:latest

      - name: Check deployment
        run: |
          Start-Sleep -Seconds 5
          $response = Invoke-RestMethod -Uri http://localhost:5001/health
          if ($response.status -eq "healthy") {
            Write-Host "Deployment successful"
          } else {
            exit 1
          }

      - name: Show running containers
        run: docker ps --filter "name=python-app"